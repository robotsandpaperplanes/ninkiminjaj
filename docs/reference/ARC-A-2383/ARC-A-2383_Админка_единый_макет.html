'Удалённые диски':()=>box('Удалённые диски',`<p>Здесь администратор видит удалённые общие диски и может восстановить диск целиком с содержимым.</p>${report(['Название диска','Дата удаления','Состояние'],[['Архив проекта','—','Удалён']])}`),
'Восстановить файлы (общие диски)':()=>box('Восстановить файлы',card('Выбрать общий диск','Где находились удалённые файлы')+card('Кто удалил','Отбор по сотруднику')+card('Когда файлы были удалены','Период удаления')+`<p class="muted">Задача восстановления файлов. Поля показаны для ознакомления.</p>`),
'Документы в общем доступе':()=>box('Документы в общем доступе',`<p>Файлы с доступом по ссылке внутри компании или вовне. Администратор может контролировать публичные ссылки, срок действия, пароль, ограничения скачивания и права.</p>${report(['Документ','Тип доступа','Срок действия'],[['План проекта.docx','По ссылке','—'],['Отчёт.xlsx','Внешняя ссылка','—']])}`),
'Политики внешнего доступа':()=>box('Политики внешнего доступа',card('Передача файлов за пределы компании','Разрешение или запрет публичных внешних ссылок')+card('Пароль для внешней ссылки','Обязательность пароля')+card('Срок действия ссылки','Ограничение времени доступа')+card('Исключения','Отдельные пользователи')),
'Политики общего доступа':()=>box('Политики общего доступа',card('Читатели и комментаторы','Скачивание, печать и копирование')+card('Редакторы','Скачивание, печать и копирование')+card('Исключения','Индивидуальные права сотрудников')),
'Смена владельца':()=>box('Смена владельца',`<p>Передача владения файлами и документами выбранного сотрудника другому сотруднику организации.</p>${card('Текущий владелец','Выбор владельца')+card('Новый владелец','Выбор получателя прав')}`),
'Восстановить файлы (корзина)':()=>box('Корзина организации · Восстановить файлы',`<p>Восстановление удалённых файлов организации из корзины.</p>${report(['Файл','Пользователь','Удалён'],[['Документ.docx','Сотрудник 1','—']])}`),
'Политики хранения (Диск)':()=>box('Политики хранения',card('Срок хранения в корзине','Правила хранения удалённых файлов')+card('Удаление по истечении срока','Правила очистки корзины')),
'Аудит Диска':()=>box('Аудит',`<p>История файловых и административных операций с возможностью отбора по параметрам события.</p>${report(['Событие','Объект','Время'],[['Изменение доступа','План проекта.docx','—']])}`),
'Уведомления Диска':()=>box('Уведомления',`<p>Уведомления при превышении заданного количества операций с файлами за сутки. Пороговые параметры применяются к операциям через Диск.</p>${['Экспорт файлов организации','Скачивание файлов организации','Копирование файлов организации','Открытие публичного доступа к файлам','Создание публичных ссылок','Приглашение внешних соавторов в файлы'].map(x=>card(x,'Параметры уведомления')).join('')}`),
'Отчёты Диска':()=>box('Отчёты',`<p>Формирование доступных отчётов по использованию Диска и действиям в организации.</p>${report(['Отчёт','Период'],[['Использование дискового пространства','—'],['Операции с файлами','—']])}`),
'Галерея':()=>box('Галерея',`<p>Доступные организации шаблоны документов, таблиц и презентаций.</p>${report(['Шаблон','Тип'],[['Шаблон документа','Документ'],['Шаблон таблицы','Таблица']])}`),
'На модерации':()=>box('На модерации',`<p>Шаблоны, ожидающие проверки перед публикацией в галерее организации.</p>${report(['Шаблон','Состояние'],[['Новый шаблон','На модерации']])}`),
'Политики шаблонов':()=>box('Политики шаблонов',card('Создание шаблонов','Кто может добавлять шаблоны')+card('Модерация','Порядок публикации и проверки шаблонов'))
};
return (diskPages[page]||(()=>box(page,`<p>Раздел административной консоли Диска / Документов.</p>`)))()+`<p class="static-footnote">Пример интерфейса · операции недоступны</p>`;
}
function mailPage(){if(page==='Ящики')return box('Почтовые ящики',`<p>Демонстрация композиции существующего раздела Почты. Личные и общие ящики, доступные функции и ограничения — по руководству.</p><div class="form-row"><div class="field"><label>Адрес</label><input placeholder="user"/></div><div class="field"><label>Домен</label><select><option>@example.com (пример)</option></select></div><div class="field"><label>Пароль</label><input placeholder="Не менее 8 символов" type="password"/></div></div><label><input type="checkbox"/> Общий ящик</label><div style="margin:12px 0">${btn('СОЗДАТЬ ЯЩИК (ДЕМО)')}</div>${rows(['Email','Имя','Расход','Действие'],[['ivanov@example.com','Иванов Иван','1,2 ГБ','<button class="btn" onclick="ask(\'Открыть ящик\',\'Демо\')">Настроить</button>'],['support@example.com','Общий ящик','4,8 ГБ','<button class="btn" onclick="ask(\'Открыть общий ящик\',\'Демо\')">Настроить</button>']])}<div class="notice">Первоначальный доступ BoxUser к администрированию Почты без заранее созданного ящика требует согласования с командой Почты.</div>`);
if(page==='Календари')return box('Календари',`<p>Политика видимости, доступ к календарям сотрудников, расписание ресурсов и аудит.</p>${rows(['Домен','Видимость по умолчанию','Для внешних'],[['example.com','Занятость','Нет доступа']])}${btn('НАСТРОИТЬ ДОСТУП (ДЕМО)')}`);
return box(page,`<p>Сохранена предметная функция Почты из руководства администратора организации (версия 1.0). Содержимое, условные права и подтверждения должны остаться эквивалентны существующему поведению.</p>${information('В этом макете проверяются расположение страницы и структура меню. Функциональный экран и связь с сервером Почты не реализованы.')}`)}
function generic(){return box(page,`<div class="note">Существующий административный раздел из руководства Встреч. В текущей истории не меняем его предметную логику; в макете показано место в общей навигации.</div><p>Точные поля и текущие действия сохраняются по существующему интерфейсу. Новых операций здесь не проектируем.</p>`)}
function mainContent(){if(area==='Общее'){if(page==='Управление решением')return systemPage();if(page==='Сетевые настройки')return networkPage();if(page==='Сертификаты')return certPage();if(page==='Лицензия')return licensePage();if(page==='Логи и диагностика')return diagnosticPage();return generic()};if(area==='Встречи')return page==='ВКС и медиа'?mediaPage():features('Встречи');if(area==='Чаты')return features('Чаты');if(area==='Доски')return boardsPage();if(area==='Диск / Документы')return diskPage();return mailPage()}
function render(){document.querySelector('#areas').innerHTML=areas.map(a=>`<button class="${a===area?'active':''}" onclick="setArea('${a}')"><span class="ico">${ICONS[a]}</span><span>${a}</span></button>`).join('');let structure=NAV[area];let isNew=p=>['Управление решением','Логи и диагностика','ВКС и медиа','Управление функциональностью · Встречи','Управление функциональностью · Чаты'].includes(p);document.querySelector('#sections').innerHTML=`<div class="sect-head">${area}</div><div class="navlegend"><strong>● Жирным — новые интерактивные сценарии</strong><br>Обычным — существующие страницы или обзор структуры. Сертификаты, лицензия и IP — просмотр без действий.</div>`+Object.entries(structure).map(([group,items])=>`<div class="group-label">${group}</div>${items.map(p=>`<button class="${p===page?'active':''} ${isNew(p)?'proposed':''}" onclick="setPage('${p.replace(/'/g,"\'")}')">${p}</button>`).join('')}`).join('');renderMain()}
function renderMain(){document.querySelector('#main').innerHTML=`<div class="crumb">Администрирование / ${area} / ${page}</div><div class="page-top"><div><h1>${page}</h1><p>${area==='Общее'?'Общие операции для управляемой инсталляции':'Продуктовый контекст: '+area}</p></div><span class="demo">МАКЕТ · ДАННЫЕ ИМИТИРУЮТСЯ</span></div>${mainContent()}<div class="foot">Демонстрационные данные. Административные операции не выполняются на реальной инсталляции.</div>`;if(page==='Логи и диагностика' && area==='Общее'){const frame=document.getElementById('healthcheckFrame');if(frame){frame.srcdoc=decodeURIComponent(Array.from(atob(HEALTHCHECK_DOCUMENT_BASE64),c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0')).join(''));}}if(page==='Управление решением' && area==='Общее'){const frame=document.getElementById('solutionFrame');if(frame){frame.srcdoc=decodeURIComponent(Array.from(atob(SOLUTION_DOCUMENT_BASE64),c=>'%'+c.charCodeAt(0).toString(16).padStart(2,'0')).join(''));}}}

function boardsPage(){
const boardPages={
'Организации Досок':box('Организации',`<p>Администратор управляет организациями Досок: создаёт организацию, просматривает данные, меняет тариф, название, количество лицензий и состав администраторов. Удаление организации также предусмотрено существующей консолью.</p>${rows(['Организация','Тариф','Лицензии'],[['Основная организация','Корпоративный','100'],['Проектная организация','Стандартный','30']])}<div class="settingline"><strong>Карточка организации</strong><span>Название · тариф · лицензии · администраторы · синхронизация</span></div>`),
'Домены Досок':box('Домены организации',`<p>Просмотр доменов выбранной организации, добавление и удаление доменов.</p>${rows(['Домен','Организация'],[['boards.example.ru','Основная организация'],['example.ru','Основная организация']])}`),
'Импорт участников Досок':box('Загрузить аккаунты',`<p>Групповой импорт участников Досок из CSV-файла. В файле также могут передаваться команды и роли участников организации.</p><div class="static-top"><strong>Импорт участников из CSV</strong><p>Выбор файла и запуск импорта доступны в действующей админке Досок.</p></div>`)
};return (boardPages[page]||box(page,'<p>Раздел администрирования Досок.</p>'))+'<p class="static-footnote">Пример интерфейса · операции недоступны</p>';
}
function diagContent(s){if(s==='Ресурсы')return rows(['Параметр','Текущее значение (пример)'],[['CPU','24%'],['RAM','61%'],['Swap','0 / 8 ГБ'],['/opt','47%'],['Inodes','18%']]);if(s==='Контейнеры')return rows(['Контейнер','Состояние','Перезапуски'],[['web','running','0'],['media','running','1'],['example-worker','exited','2']]);return rows(['Проверка','Результат'],[['Docker daemon','Доступен (пример)'],['DNS — внутренний FQDN','Разрешён (пример)'],['Kafka — соединение','Нет данных (пример)']])}
function setDiagnosticSubTab(x){document.querySelectorAll('[id^="dt"]').forEach(b=>b.classList.toggle('active',b.id==='dt'+x));document.querySelector('#diagPanel').innerHTML=diagContent(x)}
function applyMediaQuality(){let v=document.querySelector('#mediaQuality').value;if(v===demoQuality){notify('Новое качество совпадает с текущим');return}ask('Изменить качество видео?',`Качество ${demoQuality} → ${v}. Применение перезапустит media; активные встречи могут прерваться.`);document.querySelector('#modalConfirm').onclick=()=>{demoQuality=v;closeModal();renderMain();notify('Только демонстрация: значение изменено в макете')}}
function validIp(v){let p=v.split('.');return p.length===4&&p.every(x=>/^\d+$/.test(x)&&Number(x)<=255&&Number(x)>=0)}
function applyMediaIps(){let a=document.querySelector('#webrtcIp1').value.trim(),b=document.querySelector('#webrtcIp2').value.trim();if(!validIp(a)||(b&&(!validIp(b)||a===b))){notify('Проверьте введённые внешние IP');return}ask('Изменить внешние IP WebRTC?',`Текущие: ${demoMediaIps.join(', ')}. Новые: ${[a,b].filter(Boolean).join(', ')}. Media-компоненты могут перезапуститься.`);document.querySelector('#modalConfirm').onclick=()=>{demoMediaIps=[a,b].filter(Boolean);closeModal();renderMain();notify('Только демонстрация: адреса обновлены в макете')}}
function featureAction(product,status){let name=document.querySelector('#featureName').value.trim(),scope=document.querySelector('#featureScope').value,email=(document.querySelector('#featureUser')?.value||'').trim();if(!name){notify('Укажите техническое название фичи');return}if(scope==='Пользователь'&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){notify('Укажите корректный email');return}let key=[name,scope,email].join('|');ask(status==='Включена'?'Активировать функциональность?':'Деактивировать функциональность?',`${product}, ${name}, ${scope}${email?' / '+email:''}. Подтвердить демонстрационное изменение?`);document.querySelector('#modalConfirm').onclick=()=>{demoFeatures[product][key]=status;demoFeatureHistory.unshift({product,name,scope:scope+(email?' · '+email:''),status});closeModal();renderMain();notify('Только макет: изменение отражено в таблице')}}

render();</script></body></html>
